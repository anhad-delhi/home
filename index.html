<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="page--landing">

  <main class="stage">

    <div class="stage__frame">
      <picture>
        <source media="(max-width: 860px)" srcset="assets/web/herophone.jpg">
        <img class="stage__photo" src="assets/web/hero.jpg" alt="A dancer and a cellist on a darkened stage.">
      </picture>
    </div>

    <h1 class="stage__logo">
      <img src="assets/anhad-logo.png" alt="Anhad">
    </h1>

    <a class="orb orb--about" href="about.html" aria-label="about anhad">
      <span class="orb__label">
        <span class="orb__text orb__text--rest">about<br>anhad</span>
        <span class="orb__text orb__text--hover">about the show, our members, and the setlist</span>
      </span>
    </a>

    <a class="orb orb--gallery" href="gallery.html" aria-label="gallery">
      <span class="orb__label">
        <span class="orb__text orb__text--rest">gallery</span>
        <span class="orb__text orb__text--hover">media from our shows!</span>
      </span>
    </a>

    <a class="orb orb--tickets" href="tickets.html" aria-label="ticket counter">
      <span class="orb__label">
        <span class="orb__text orb__text--rest">ticket<br>counter</span>
        <span class="orb__text orb__text--hover">tickets for our show on 11th december</span>
      </span>
    </a>

    <a class="stage__upcoming" href="tickets.html">Upcoming: Kunzum Books Delhi, 11 December 2026</a>
    
  </main>

  <!-- ===== mobile only: everything below is display:none above 860px ===== -->

  <div class="scrim" hidden></div>

  <button class="menu-btn" type="button"
          aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
    <span class="menu-btn__bars" aria-hidden="true"></span>
  </button>

  <nav class="drawer" id="drawer" aria-label="Main">
    <ul class="drawer__list">
      <li><a class="drawer__link" href="index.html">Home</a></li>
      <li><a class="drawer__link" href="about.html">About Anhad</a></li>
      <li><a class="drawer__link" href="members.html">Members</a></li>
      <li><a class="drawer__link" href="setlist.html">Set List</a></li>
      <li><a class="drawer__link" href="tickets.html">Ticket Counter</a></li>
      <li><a class="drawer__link" href="gallery.html">Gallery</a></li>
    </ul>
  </nav>
  
  <nav class="social" aria-label="Anhad on social media">
    <a class="social__link" href="https://www.youtube.com/@anhad-production"
       target="_blank" rel="noopener noreferrer">
      <img src="assets/ytlogo.png" alt="Anhad on YouTube">
    </a>
    <a class="social__link" href="https://www.instagram.com/anhad.production"
       target="_blank" rel="noopener noreferrer">
      <img src="assets/iglogo.png" alt="Anhad on Instagram">
    </a>
  </nav>
<script>
(function () {
  var btn    = document.querySelector('.menu-btn');
  var drawer = document.getElementById('drawer');
  var scrim  = document.querySelector('.scrim');
  if (!btn || !drawer || !scrim) return;

  var links = Array.prototype.slice.call(document.querySelectorAll('#drawer a, .social a'));
  var open  = false;

  function setOpen(state) {
    open = state;
    btn.classList.toggle('is-open', state);
    drawer.classList.toggle('is-open', state);
    btn.setAttribute('aria-expanded', state ? 'true' : 'false');
    btn.setAttribute('aria-label', state ? 'Close menu' : 'Open menu');
    document.body.classList.toggle('is-locked', state);

    if (state) {
      scrim.hidden = false;
      requestAnimationFrame(function () { scrim.classList.add('is-on'); });
      links[0].focus();
    } else {
      scrim.classList.remove('is-on');
      setTimeout(function () { if (!open) scrim.hidden = true; }, 400);
    }
  }

  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    setOpen(!open);
    if (!open) btn.focus();
  });

  scrim.addEventListener('click', function () { setOpen(false); btn.focus(); });

  document.addEventListener('keydown', function (e) {
    if (!open) return;
    if (e.key === 'Escape') { setOpen(false); btn.focus(); return; }
    if (e.key !== 'Tab') return;

    /* keep focus inside the drawer */
    var ring  = [btn].concat(links);
    var first = ring[0];
    var last  = ring[ring.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  /* if the window is widened back past the breakpoint, reset cleanly */
  var mq = window.matchMedia('(min-width: 861px)');
  (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(
    function (ev) { if ((ev.matches !== undefined ? ev.matches : mq.matches) && open) setOpen(false); }
  );
})();
</script>

</body>
</html>
